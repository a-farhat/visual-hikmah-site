<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Visual Hikmah | Timeless Wisdom, Visually Shared</title>

  <meta name="description"
        content="Visual Hikmah presents timeless Islamic wisdom through concise reflections, practical lessons, and visual storytelling.">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      background: #f5efe5;
      color: #183f42;
    }

    main {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
    }

    .container {
      max-width: 760px;
    }

    .brand {
      font-size: 14px;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 30px;
    }

    h1 {
      font-size: clamp(42px, 8vw, 78px);
      margin: 0 0 18px;
      font-weight: normal;
    }

    .tagline {
      font-size: 22px;
      line-height: 1.6;
      margin-bottom: 40px;
    }

    .divider {
      width: 70px;
      height: 1px;
      background: #a88745;
      margin: 30px auto;
    }

    .coming {
      font-family: Arial, sans-serif;
      font-size: 15px;
      letter-spacing: 1px;
      opacity: 0.8;
    }

    footer {
      margin-top: 70px;
      font-family: Arial, sans-serif;
      font-size: 13px;
      opacity: 0.7;
    }
  </style>
</head>

<body>

<main>
  <div class="container">

    <div class="brand">Visual Hikmah</div>

    <h1>Timeless Wisdom</h1>

    <div class="divider"></div>

    <p class="tagline">
      Islamic wisdom presented through visual reflection,
      practical lessons, and thoughtful storytelling.
    </p>

    <p class="coming">
      Forty Hadith • Nahj al-Balāgha • Qur'an Reflections
    </p>

    <footer>
      © 2026 Visual Hikmah
    </footer>

  </div>
</main>

</body>
</html>
